plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '2.4.0'
    id 'org.springframework.boot' version '3.5.15'
    id 'org.jetbrains.kotlin.plugin.spring' version '2.4.0'
    id 'jacoco'
    id("com.github.davidmc24.gradle.plugin.avro") version "1.9.1"
}

repositories {
    maven {
        url "https://packages.confluent.io/maven/"
    }
    mavenCentral()
    mavenLocal()
}

jacocoTestReport {
    dependsOn test
            reports {
                csv.required = true
            }
}


dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.5.15')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation ('org.springframework.kafka:spring-kafka:3.3.16') {
        exclude group: 'org.lz4', module: 'lz4-java'
    }

    implementation("io.confluent:kafka-avro-serializer:7.9.5") {
        exclude group: "org.lz4", module: "lz4-java"
    }
    implementation("org.apache.avro:avro:1.12.1")
    implementation("io.confluent:kafka-schema-registry-client:7.9.8") {
        exclude group: "org.lz4", module: "lz4-java"
    }

    testImplementation("io.specmatic.enterprise:executable:$specmaticEnterpriseVersion")
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation('org.assertj:assertj-core:3.27.7', 'org.junit.jupiter:junit-jupiter-api:6.1.0')
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.0'
    testImplementation "org.testcontainers:junit-jupiter:1.21.4"
}

group = 'io.specmatic.sample'
version = '1.0-SNAPSHOT'

avro {
    setCreateSetters(true)
    fieldVisibility.set("PRIVATE")
    outputCharacterEncoding.set("UTF-8")
}

sourceSets {
    main {
        java.srcDirs("build/generated-main-avro-java")
    }
}

tasks.withType(JavaCompile).configureEach {
    dependsOn 'generateAvroJava'
}

test {
    useJUnitPlatform {
        includeEngines("junit-jupiter")
    }
}
