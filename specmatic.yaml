version: 3
systemUnderTest:
  service:
    $ref: "#/components/services/createOrderService"
    runOptions:
      $ref: "#/components/runOptions/createOrderServiceTest"
dependencies:
  services:
    - service:
        $ref: "#/components/services/placeOrderService"
        runOptions:
          $ref: "#/components/runOptions/placeOrderServiceMock"
components:
  sources:
    specmaticOrderContracts:
      git:
        url: https://github.com/specmatic/specmatic-order-contracts.git
  services:
    createOrderService:
      definitions:
        - definition:
            source:
              $ref: "#/components/sources/specmaticOrderContracts"
            specs:
              - io/specmatic/examples/store/openapi/data_pipeline/order_service/v1/create-order-service-v1.yaml
    placeOrderService:
      definitions:
        - definition:
            source:
              $ref: "#/components/sources/specmaticOrderContracts"
            specs:
              - io/specmatic/examples/store/asyncapi/3_0_0/data_pipeline/order_service/v1/new-orders-async-avro-v1.yaml
  runOptions:
    createOrderServiceTest:
      openapi:
        type: test
        baseUrl: "http://localhost:8080"
        filter: "PATH!='/health,/swagger/v1/swagger,/swagger-ui.html'"
        actuatorUrl: "http://localhost:8080/actuator/mappings"
    placeOrderServiceMock:
      asyncapi:
        type: mock
        servers:
          - host: localhost:9092
            protocol: kafka
        schemaRegistry:
          kind: CONFLUENT
          url: http://localhost:8085
          username: admin
          password: admin-secret